# Alembic configuration for the Parallax API.
#
# The database URL is not stored here: migrations/env.py reads it from the
# application settings (DATABASE_URL), so a deploy and a migration can never
# disagree about which database they are talking to.
#
#   alembic upgrade head        # apply schema changes (deploy step)
#   alembic revision --autogenerate -m "describe the change"
#   alembic downgrade -1

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Fail loudly if a migration leaves the model metadata out of sync.
compare_type = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
