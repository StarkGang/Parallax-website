[project]
name = "parallax-api"
version = "2.0.0"
description = "Parallax ISTE Student Convention API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "gunicorn==23.0.0",
  "pydantic==2.11.3",
  "pydantic-settings==2.8.1",
  "email-validator==2.2.0",
  "sqlalchemy[asyncio]==2.0.40",
  "asyncpg==0.30.0",
  "aiosqlite==0.21.0",
  "alembic==1.15.2",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.10.1",
  "cryptography==44.0.2",
  "pyotp==2.9.0",
  "pillow==11.1.0",
  "defusedxml==0.7.1",
  "nh3==0.2.21",
  "structlog==25.2.0",
  "python-multipart==0.0.20",
  "segno==1.6.6",
  "qrcode>=8.0",
  "markdown==3.7",
  "aioboto3==13.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "anyio==4.9.0",
  "pip-audit==2.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
