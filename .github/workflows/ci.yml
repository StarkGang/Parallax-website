name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: frontend/dist
          retention-days: 3

  backend:
    name: Backend (SQLite test suite)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pytest==8.3.5" "pytest-asyncio==0.26.0" "anyio==4.9.0"
      - name: Run tests
        run: python -m pytest -q

  single-app:
    name: Single app (SQLite + demo data)
    runs-on: ubuntu-24.04
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: frontend/dist
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Boot the app on SQLite with seeded demo data
        working-directory: backend
        env:
          APP_ENV: development
          APP_DEBUG: "false"
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/parallax-ci.db
          SPA_DIST: ${{ github.workspace }}/frontend/dist
          STORAGE_BACKEND: local
          LOCAL_STORAGE_DIR: ${{ runner.temp }}/storage
          ALLOWED_HOSTS: 127.0.0.1,localhost
          FRONTEND_ORIGIN: http://127.0.0.1:8000
          COOKIE_SECURE: "false"
          DEV_AUTH_ENABLED: "true"
          ALLOW_DIRECT_LOGIN: "true"
          SEED_DEMO_DATA: "true"
          PAYMENTS_ENABLED: "false"
          MFA_ENFORCED: "false"
          SERVER_SECRET_KEY: 5f2b8c1d9e4a7b3c6d0e8f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/storage"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "${{ runner.temp }}/app.log" 2>&1 &
          echo $! > "${{ runner.temp }}/app.pid"

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8000/healthz; then
            echo "--- app log ---"
            cat "${{ runner.temp }}/app.log"
            exit 1
          fi
          curl -fsS http://127.0.0.1:8000/health/ready
          echo

      - name: Smoke test the served SPA, seeded data and mock payment flow
        run: |
          python - <<'PY'
          import re

          import httpx

          base = "http://127.0.0.1:8000"

          with httpx.Client(base_url=base, headers={"Origin": base}, timeout=20) as client:
              # The built SPA is served by FastAPI on the same origin.
              index = client.get("/")
              index.raise_for_status()
              assert 'id="root"' in index.text, "SPA shell was not served at /"

              asset = re.search(r'src="(/assets/[^"]+\.js)"', index.text)
              assert asset, "built SPA did not reference an asset bundle"
              bundle = client.get(asset.group(1))
              bundle.raise_for_status()
              assert bundle.content, "asset bundle was empty"

              edition = client.get("/api/v1/public/editions/current").json()["data"]
              assert edition["name"], edition
              events = client.get(
                  f"/api/v1/public/editions/{edition['slug']}/events?pageSize=100"
              ).json()
              rows = events.get("data") or []
              assert rows, "demo edition has no seeded events"
              print(f"seeded edition: {edition['name']} ({len(rows)} events)")

              # Development sign-in, then a complete mock pass purchase.
              login = client.post(
                  "/api/v1/auth/login",
                  json={"email": "participant@parallax.local", "role": "participant"},
              )
              login.raise_for_status()
              csrf = client.get("/api/v1/auth/csrf").json()["csrfToken"]
              headers = {"X-CSRF-Token": csrf}

              order = client.post(
                  f"/api/v1/editions/{edition['id']}/pass/order",
                  json={},
                  headers=headers,
              )
              order.raise_for_status()
              order_id = order.json()["data"]["orderId"]

              paid = client.post(
                  f"/api/v1/editions/{edition['id']}/payments/{order_id}/mock",
                  json={},
                  headers=headers,
              )
              paid.raise_for_status()

              user_pass = client.get(f"/api/v1/editions/{edition['id']}/pass").json()["data"]
              assert user_pass["status"] == "active", user_pass
              print("mock pass flow: active pass issued")

              registrations = client.get(
                  f"/api/v1/editions/{edition['id']}/registrations"
              )
              registrations.raise_for_status()
          print("single-app smoke test passed")
          PY

      - name: Stop the app
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/app.pid" ]; then
            kill "$(cat "${{ runner.temp }}/app.pid")" 2>/dev/null || true
          fi
          echo "--- app log (tail) ---"
          tail -n 50 "${{ runner.temp }}/app.log" || true
